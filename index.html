<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GGNesia - Portal Game & Esports Indonesia</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- HEADER -->
  <header class="header">

    <div class="logo">
      🎮 GGNesia
    </div>

    <!-- SEARCH DI KANAN ATAS -->
    <div class="search-box">
      <input
        type="text"
        id="searchInput"
        placeholder="Cari berita, game, team, pemain..."
      >

      <button onclick="searchContent()">
        🔎
      </button>
    </div>

  </header>


  <!-- MENU -->
  <nav class="navbar">

    <a href="#">🏠 Home</a>

    <a href="#">📰 Berita</a>

    <a href="#">🏆 eSports</a>

    <a href="#">🎮 Games</a>

    <a href="#">🔥 Trending</a>

  </nav>


  <!-- ISI WEBSITE -->
  <main>

    <section class="hero">

      <h1>GGNesia</h1>

      <p>
        Portal Dunia Game & Esports Indonesia
      </p>

    </section>


    <!-- TRENDING -->
    <section class="trending">

      <h2>🔥 Trending</h2>

      <div id="trendingList">

        <!-- Berita trending nantinya masuk otomatis di sini -->

      </div>

    </section>


    <!-- BERITA TERBARU -->
    <section class="latest-news">

      <h2>📰 Berita Game Terbaru</h2>

      <div id="newsList">

        <!-- Berita otomatis nantinya masuk di sini -->

      </div>

    </section>


    <!-- GAMES -->
    <section class="games">

      <h2>🎮 Games</h2>

      <div class="game-list">

        <div>Mobile Legends</div>

        <div>PUBG Mobile</div>

        <div>Free Fire</div>

        <div>Valorant</div>

        <div>Game Lainnya</div>

      </div>

    </section>


    <!-- ESPORTS -->
    <section class="esports">

      <h2>🏆 eSports</h2>

      <div class="esports-menu">

        <div>Turnamen</div>

        <div>Jadwal</div>

        <div>Hasil</div>

        <div>Klasemen</div>

        <div>Team</div>

        <div>Pemain</div>

      </div>

    </section>

  </main>


  <!-- JAVASCRIPT -->
  <script src="script.js"></script>

</body>
</html>
